# Publishes the page on GitHub Pages whenever one of the two branches that hold a version of the page changes. The page is static: there is nothing to build.
#   web           the complete page, at the address of the site
#   no-greenwich  the page without the Greenwich angle, at <address of the site>/no-greenwich/
# A repository has one Pages site, so both versions are assembled into one site; the version of a branch that does not exist (yet) is left out.
# In the settings of the repository, Pages must use the source "GitHub Actions". The file is the same in both branches.
name: Pages
on:
  push:
    branches: [web, no-greenwich]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: The complete page (branch web)
        id: full
        uses: actions/checkout@v5
        with:
          ref: web
          path: _web
        continue-on-error: true
      - name: The page without the Greenwich angle (branch no-greenwich)
        id: plain
        uses: actions/checkout@v5
        with:
          ref: no-greenwich
          path: _no_greenwich
        continue-on-error: true
      - name: Assemble the site
        run: |
          mkdir site
          if [ "${{ steps.full.outcome }}" = "success" ]; then cp -a _web/. site/; fi
          if [ "${{ steps.plain.outcome }}" = "success" ]; then mkdir -p site/no-greenwich && cp -a _no_greenwich/. site/no-greenwich/; fi
          if [ "${{ steps.full.outcome }}" != "success" ] && [ "${{ steps.plain.outcome }}" = "success" ]; then cp -a _no_greenwich/. site/; fi
          rm -rf site/.git site/.github site/no-greenwich/.git site/no-greenwich/.github
          touch site/.nojekyll
      - name: Give the files a version in their addresses
        # Browsers keep the files of a page for ten minutes (GitHub Pages sends max-age=600). A visitor who has opened an older version of the page then gets old files
        # together with the new ones and sees an error. A version in the address of every module (app.js?v=...) makes every deployment a set of new addresses.
        run: |
          cat > versioned_urls.py <<'EOF'
          import pathlib, re, sys
          site, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          if not (site/'index.html').exists():
              sys.exit(0)
          nested = site/'no-greenwich'                                                      # another version of the page below this one: not touched here
          for path in site.rglob('*.js'):
              if 'vendor' in path.parts or nested in path.parents:
                  continue
              text = path.read_text(encoding='utf-8')
              path.write_text(re.sub(r"(from\s+')(\.{1,2}/[^'?]+\.js)(')", lambda m: f"{m.group(1)}{m.group(2)}?v={version}{m.group(3)}", text), encoding='utf-8')
          index = site/'index.html'
          html = index.read_text(encoding='utf-8')
          html = html.replace('src="app/app.js"', f'src="app/app.js?v={version}"').replace('href="style.css"', f'href="style.css?v={version}"')
          index.write_text(html, encoding='utf-8')
          EOF
          python3 versioned_urls.py site "${GITHUB_SHA::10}"
          python3 versioned_urls.py site/no-greenwich "${GITHUB_SHA::10}"
          grep -n "app.js" site/index.html
          ls site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

# Publishes the page on GitHub Pages whenever the branch no-greenwich changes. The page is static: there is nothing to build.
#   no-greenwich  the page without the Greenwich angle, at the address of the site
# The branch web (the page with the Greenwich angle) is not published. In the settings of the repository, Pages must use the source "GitHub Actions".
# The file is the same in both branches.
name: Pages
on:
  push:
    branches: [no-greenwich]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: The page without the Greenwich angle (branch no-greenwich)
        uses: actions/checkout@v5
        with:
          ref: no-greenwich
          path: _no_greenwich
      - name: Assemble the site
        run: |
          mkdir site
          cp -a _no_greenwich/. site/
          rm -rf site/.git site/.github
          touch site/.nojekyll
      - name: Give the files a version in their addresses
        # Browsers keep the files of a page for ten minutes (GitHub Pages sends max-age=600). A visitor who has opened an older version of the page then gets old files
        # together with the new ones and sees an error. A version in the address of every module (app.js?v=...) makes every deployment a set of new addresses.
        run: |
          cat > versioned_urls.py <<'EOF'
          import pathlib, re, sys
          site, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          if not (site/'index.html').exists():
              sys.exit(0)
          for path in site.rglob('*.js'):
              if 'vendor' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              path.write_text(re.sub(r"(from\s+')(\.{1,2}/[^'?]+\.js)(')", lambda m: f"{m.group(1)}{m.group(2)}?v={version}{m.group(3)}", text), encoding='utf-8')
          index = site/'index.html'
          html = index.read_text(encoding='utf-8')
          html = html.replace('src="app/app.js"', f'src="app/app.js?v={version}"').replace('href="style.css"', f'href="style.css?v={version}"')
          index.write_text(html, encoding='utf-8')
          EOF
          python3 versioned_urls.py site "${GITHUB_SHA::10}"
          grep -n "app.js" site/index.html
          ls site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
